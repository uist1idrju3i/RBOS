name: NCS Bare Metal の準備
description: 固定した toolchain と BM v2.0.1 の workspace を用意する
inputs:
  cache-workspace:
    description: BM workspace の main cache を復元する
    default: 'false'
  save-workspace:
    description: main の job で検査済み workspace を保存する
    default: 'false'
runs:
  using: composite
  steps:
    - name: nrfutil と sdk-manager の固定版を用意する
      shell: bash
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/nrfutil-bin"
        mkdir -p "$bin"
        curl --fail --location --retry 3 \
          https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil-x86_64-unknown-linux-gnu-1.4.2-8a9090a \
          --output "$bin/nrfutil"
        echo "a14996288928a92081cadeefd2dd37fcb54ee99a568fd4eaa6fb9586a51fba57  $bin/nrfutil" | sha256sum --check
        chmod +x "$bin/nrfutil"
        "$bin/nrfutil" --version
        "$bin/nrfutil" install sdk-manager=1.17.0
        echo "$bin" >> "$GITHUB_PATH"

    - name: toolchain bundle をキャッシュする
      id: toolchain
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ncs/toolchains
        key: ncs-bm-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-911f4c5c26

    - name: 固定した toolchain bundle を導入する
      if: steps.toolchain.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        nrfutil sdk-manager toolchain install \
          --toolchain-bundle-id 911f4c5c26 --for-ncs-version v3.3.0 \
          --install-dir "$RUNNER_TEMP/ncs" --skip-cmake-registration

    - name: toolchain の環境を後続の step へ渡す
      shell: bash
      run: |
        set -eo pipefail
        nrfutil sdk-manager toolchain env --toolchain-bundle-id 911f4c5c26 \
          --install-dir "$RUNNER_TEMP/ncs" --as-script sh > "$RUNNER_TEMP/ncs-env.sh"
        # The generated script may reference unset host environment variables.
        # shellcheck source=/dev/null
        source "$RUNNER_TEMP/ncs-env.sh"
        python3 - "$RUNNER_TEMP/ncs-env.sh" <<'PY'
        import os
        import pathlib
        import re
        import sys
        import uuid

        script = pathlib.Path(sys.argv[1]).read_text()
        names = re.findall(r'^export ([A-Za-z_][A-Za-z_0-9]*)=', script, re.MULTILINE)
        with open(os.environ['GITHUB_ENV'], 'a') as output:
            for name in names:
                delimiter = uuid.uuid4().hex
                output.write(f'{name}<<{delimiter}\n{os.environ[name]}\n{delimiter}\n')
            output.write(f"BM_WORKSPACE={os.environ['RUNNER_TEMP']}/ncs-bm\n")
        PY

    - name: workspace の復元時間を測り始める
      if: inputs.cache-workspace == 'true'
      id: workspace-clock
      shell: bash
      run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

    - name: main の BM workspace を復元する
      if: inputs.cache-workspace == 'true'
      id: workspace
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ncs-bm
        key: ncs-bm-workspace-v1-${{ runner.os }}-${{ runner.arch }}-v2.0.1-${{ hashFiles('tools/bm-build/modules.txt') }}

    - name: BM workspace を更新し module の版と所要時間を検査する
      shell: bash
      env:
        WORKSPACE_CACHE_HIT: ${{ steps.workspace.outputs.cache-hit }}
        WORKSPACE_RESTORE_STARTED: ${{ steps.workspace-clock.outputs.started }}
      run: |
        set -euo pipefail
        restore_seconds=0
        if [ -n "$WORKSPACE_RESTORE_STARTED" ]; then
          restore_seconds=$(( $(date +%s) - WORKSPACE_RESTORE_STARTED ))
        fi
        SECONDS=0
        if [ "$WORKSPACE_CACHE_HIT" != 'true' ]; then
          west init -m https://github.com/nrfconnect/sdk-nrf-bm --mr v2.0.1 "$BM_WORKSPACE"
        fi
        init_seconds=$SECONDS
        cd "$BM_WORKSPACE"
        west update --narrow -o=--depth=1
        update_seconds=$(( SECONDS - init_seconds ))
        "$GITHUB_WORKSPACE/tools/bm-build/check-workspace.sh" "$BM_WORKSPACE"
        check_seconds=$(( SECONDS - init_seconds - update_seconds ))
        echo "BM workspace: cache_hit=${WORKSPACE_CACHE_HIT:-false} restore=${restore_seconds}s init=${init_seconds}s update=${update_seconds}s check=${check_seconds}s total=$(( restore_seconds + SECONDS ))s"

    - name: 検査済みの BM workspace を main に保存する
      if: inputs.cache-workspace == 'true' && inputs.save-workspace == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.workspace.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ncs-bm
        key: ${{ steps.workspace.outputs.cache-primary-key }}
