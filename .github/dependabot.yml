version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/ncs-bm-setup"
    schedule:
      interval: weekly
    commit-message:
      prefix: "依存更新:"
  - package-ecosystem: gitsubmodule
    directory: "/"
    ignore:
      - dependency-name: vendor/mrubyc
      - dependency-name: vendor/mruby
      - dependency-name: vendor/sdk-nrf-bm
    schedule:
      interval: weekly
    commit-message:
      prefix: "依存更新:"
