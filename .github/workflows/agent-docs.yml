name: agent-docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: agent-docs-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: vendor submodule を取得する
        run: git submodule update --init --depth 1

      - name: 指示とスキルの一覧・名前・リンクを検査する
        run: python3 .github/scripts/check-skills.py

      - name: スキル検査のテスト
        run: python3 -m unittest discover -s tests/check-skills
