name: firmware-release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CCACHE_DISABLE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: release の秘密鍵が設定されていることを確かめる
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RBOS_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo '::error::RBOS_RELEASE_SIGNING_KEY is empty or unavailable.'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: BM の build 環境を用意する
        uses: ./.github/actions/ncs-bm-setup

      - name: 最小 BM application を先に検査する
        run: tools/bm-build/preflight.sh "$BM_WORKSPACE" "$RUNNER_TEMP/bm-preflight"

      - name: Ruby VM の source と host build の依存を用意する
        run: |
          git submodule update --init --depth 1 vendor/mruby vendor/mrubyc
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential ruby python3
          ruby --version
          cc --version
          make --version

      - name: release の秘密鍵を一時 directory に置く
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RBOS_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo '::error::RBOS_RELEASE_SIGNING_KEY is empty or unavailable.'
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/keys/rbos-release.pem"

      - name: release を build する
        run: |
          cd "$BM_WORKSPACE"
          west build -b bm_nrf54l15dk/nrf54l15/cpuapp/s115_softdevice/mcuboot \
            "$GITHUB_WORKSPACE/firmware" --sysbuild -d "$RUNNER_TEMP/build-release" -p always -- \
            -DFILE_SUFFIX=release \
            "-DSB_CONFIG_BM_BOOTLOADER_MCUBOOT_SIGNATURE_KEY_FILE=\"$RUNNER_TEMP/keys/rbos-release.pem\"" \
            2>&1 | tee "$RUNNER_TEMP/build-release.log"

      - name: release の証拠と hash を集める
        run: |
          tools/bm-build/collect-evidence.sh "$BM_WORKSPACE" \
            "$RUNNER_TEMP/build-release" "$RUNNER_TEMP/evidence-release" "$RUNNER_TEMP/build-release.log"
          cat "$RUNNER_TEMP/evidence-release/SHA256SUMS"

      - name: release の秘密鍵を削除する
        if: always()
        run: rm -f "$RUNNER_TEMP/keys/rbos-release.pem"

      - name: 成果物と build log・鍵不在を照合する
        run: python3 tools/bm-build/verify-evidence.py "$RUNNER_TEMP/evidence-release" --profile release --revision "$GITHUB_SHA"

      - name: release の証拠を保存する
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/evidence-release
          include-hidden-files: true
          archive: true
          if-no-files-found: error
          retention-days: 90
