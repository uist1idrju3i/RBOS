name: vendor-release-watch

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vendor-release-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 正式 release の固定と新版を検査し、通知する
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/vendor-release-watch.py --json "$RUNNER_TEMP/vendor-releases.json" --update-issues
